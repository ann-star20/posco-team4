services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fab_events_test
      POSTGRES_USER: fab_events
      POSTGRES_PASSWORD: fab_events_test_only
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fab_events -d fab_events_test"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - fab-events-postgres:/var/lib/postgresql/data

volumes:
  fab-events-postgres:

