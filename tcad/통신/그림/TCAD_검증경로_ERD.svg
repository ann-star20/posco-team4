<g font-size="12" fill="#6B6880"><text x="40" y="808">route=apply 는 TCAD 서비스 작업을 만들지 않는다.</text><text x="40" y="826">보정값은 compensation.target_process_parameters 로 관리자 승인 큐에 간다.</text><text x="40" y="844">calc_mode(fake/real)는 가짜 결과를 구분하려는 제안 필드다.</text><text x="40" y="862">이벤트로 저장: ROS /fab/events 의 diagnosis.completed 가 Gateway 에 저장된다.</text><text x="40" y="880">HTTP verify: POST /api/v1/tcad/verify, tcad_request_id = request_id 로 같은 작업이다.</text></g>
</svg>