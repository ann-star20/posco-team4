[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fab-event-gateway"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "psycopg[binary]>=3.2,<4",
  "httpx>=0.27,<1",
  "uvicorn>=0.30,<1",
  "websockets>=13,<16",
]

[project.scripts]
fab-gateway = "event_gateway.app:main"
fab-ros-bridge = "event_gateway.ros_adapter:main"
fab-verification-worker = "event_gateway.verification_worker:main"
fab-mock-tcad = "mock_tcad.app:main"
fab-mock-surrogate = "mock_surrogate.app:main"
fab-tcad-service = "tcad_service.app:main"
fab-communication-check = "event_gateway.communication_check:main"

[project.optional-dependencies]
test = [
  "pytest>=8.3,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/event_gateway", "src/mock_tcad", "src/tcad_service", "src/mock_surrogate"]

[tool.pytest.ini_options]
pythonpath = ["src", "../../jetson_ws/src/fab_virtual_lot", "../../tools/mock_unity"]
testpaths = ["tests"]
