[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fab-event-gateway"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<9",
  "testcontainers[postgres]>=4.9,<5",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

