[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "posco-operator-report"
version = "0.1.0"
description = "Evidence-grounded weekly operator reports for AOI, surrogate, and TCAD events"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
operator-report = "operator_report.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

